# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Spring Application Name
spring.application.name=app-monitoring-backend

# Database Configuration - PostgreSQL Cloud SQL
spring.datasource.url=jdbc:postgresql://34.100.226.179:5432/alchemists_db
spring.datasource.username=alchmists_user
    spring.datasource.password=Alchmists_pass5
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoints.web.base-path=/management
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.monitoring=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# CORS Configuration
server.servlet.encoding.charset=UTF-8

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Log Monitoring Configuration
app.log.file.path=./logs/application.log
app.log.check.interval.seconds=40

